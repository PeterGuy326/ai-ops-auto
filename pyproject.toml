[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-auto"
version = "0.1.0"
description = "Agent-native, China-first creator operations control plane"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "ai-ops-auto contributors"}]
keywords = ["ai-agent", "creator-ops", "content-operations", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    # Official MCP Python SDK v2.  MCP is a primary Agent control-plane
    # transport, so it ships with the base package rather than an extra.
    "mcp>=2.0,<3",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.2",
    # Windows Python does not ship an IANA timezone database; scheduler doctor
    # must still be able to resolve the default Asia/Shanghai zone.
    "tzdata>=2024.1; platform_system == 'Windows'",
    # 浏览器自动化（主流，微软官方维护）
    # 默认走 playwright + 本地 Chrome channel，足以覆盖知乎/头条/公众号
    "playwright>=1.45",
    # Markdown → HTML；知乎 v1 exact renderer 的审批摘要绑定该精确版本。
    "markdown==3.10.3",
    # 图片反指纹处理（asset_processor：EXIF/微裁剪/微旋转/调色）
    "Pillow>=10",
    # FastAPI Jinja2Templates 渲染 /ui/* 页面（api/main.py 直接 import）
    "jinja2>=3",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
llm-openai = ["openai>=1.30"]
llm-anthropic = ["anthropic>=0.25"]
# 高风控平台（小红书）反检测加固档：drop-in 兼容 playwright API
stealth = ["patchright>=1.40"]
# 反检测顶配档：Firefox + C++ 层指纹欺骗，小红书首选
# 安装后需跑：python -m camoufox fetch
stealth-pro = ["camoufox[geoip]>=0.4"]
# 求职投递专题（jobhunt）：解析 PDF / Word 简历。txt/md 无需此档。
jobhunt = ["pypdf>=4", "python-docx>=1.1"]
dev = [
    "build>=1.2",
    "jsonschema>=4.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "setuptools>=77",
    "mypy>=1.9",
    # 文本查重；core/dedup.py 优先用，没装时回退到内置轻量实现
    "simhash>=2.1",
]

[project.scripts]
ai-ops = "ai_ops.cli:main"
ai-ops-mcp = "ai_ops.agent_contract.mcp_server:main"

[project.urls]
Homepage = "https://github.com/PeterGuy326/ai-ops-auto"
Repository = "https://github.com/PeterGuy326/ai-ops-auto"
Issues = "https://github.com/PeterGuy326/ai-ops-auto/issues"
Documentation = "https://github.com/PeterGuy326/ai-ops-auto/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ai_ops.api" = ["templates/*.html"]

# 顶层资源会被放入 wheel 的 share/ai-ops-auto/ 下，便于部署器与
# 运维工具发现。源码/可编辑安装仍按仓库相对路径读取这些文件。
[tool.setuptools.data-files]
"share/ai-ops-auto/prompts/accounts" = ["prompts/accounts/*.md"]
"share/ai-ops-auto/prompts/platform_style" = ["prompts/platform_style/*.md"]
"share/ai-ops-auto/prompts/topics" = ["prompts/topics/*.md"]
"share/ai-ops-auto" = ["alembic.ini"]
"share/ai-ops-auto/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"share/ai-ops-auto/alembic/versions" = ["alembic/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 changed its implicit default to a much broader ruleset. Keep the
# project's existing baseline explicit so local and CI installs enforce the
# same policy; stricter families can be adopted incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
