name: Feature request
description: Propose a control-plane capability or product direction.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user/operator problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable outcome
      description: What should a user or agent be able to observe when this is complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This belongs in a Creator Ops control plane rather than a generic agent or platform-specific uploader.
          required: true
        - label: I described any irreversible external side effects and the required human approval gate.
          required: true
