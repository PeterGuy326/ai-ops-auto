name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify shipped runtime resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required_suffixes = {
              "ai_ops/api/templates/base.html",
              "ai_ops/api/templates/dashboard.html",
              "ai_ops/api/templates/login.html",
              "ai_ops/api/templates/list.html",
              "ai_ops/api/templates/article_detail.html",
              "ai_ops/api/templates/account_detail.html",
              "share/ai-ops-auto/prompts/accounts/_template.md",
              "share/ai-ops-auto/alembic.ini",
              "share/ai-ops-auto/alembic/env.py",
              "share/ai-ops-auto/alembic/versions/b09fbf0bf0f0_initial_schema_baseline.py",
              "share/ai-ops-auto/alembic/versions/a2f7c9e4d1b6_add_agent_contract_tables.py",
              "share/ai-ops-auto/alembic/versions/d4e8a1c7b5f2_bind_contract_job_planned_time.py",
          }
          missing = sorted(
              suffix for suffix in required_suffixes
              if not any(name.endswith(suffix) for name in names)
          )
          if missing:
              raise SystemExit(f"wheel is missing runtime resources: {missing}")
          PY
      - name: Install built wheel and smoke-test CLI
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install dist/*.whl
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          cd "$smoke_dir"
          export DATABASE_URL="sqlite:///$smoke_dir/package-smoke.db"
          export DATA_DIR="$smoke_dir/data"
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" --help
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" init-db
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" doctor --json > doctor.json
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" demo --json > demo.json
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" agent --help > agent-help.txt
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" agent download-approval-asset --help > download-help.txt
          "$GITHUB_WORKSPACE/.package-venv/bin/ai-ops" gen-principal-token > principal.json
          "$GITHUB_WORKSPACE/.package-venv/bin/python" - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          import ai_ops
          from sqlalchemy import create_engine, inspect
          from ai_ops.agent_contract.cli_commands import agent_app
          from ai_ops.api.main import app
          from ai_ops.content.generator import _load_topic_prompt
          from ai_ops.core.db import get_code_alembic_head, get_db_alembic_head
          from typer.main import get_command

          assert _load_topic_prompt("dws").strip(), "wheel topic prompt is not readable"
          code_head = get_code_alembic_head()
          assert code_head, "wheel Alembic migrations are not discoverable"
          assert get_db_alembic_head() == code_head, "installed wheel did not migrate to head"
          assert code_head == "d4e8a1c7b5f2", "wheel does not contain the latest Agent contract migration"
          tables = set(inspect(create_engine(os.environ["DATABASE_URL"])).get_table_names())
          assert {"publication_plans", "approval_requests", "agent_operations"} <= tables

          expected_v1_routes = {
              ("POST", "/v1/contents"),
              ("POST", "/v1/publication-plans"),
              ("POST", "/v1/approval-requests"),
              ("GET", "/v1/approval-requests/{approval_id}"),
              ("GET", "/v1/approval-requests/{approval_id}/assets/{asset_id}"),
              ("POST", "/v1/approvals/{approval_id}/decision"),
              ("POST", "/v1/publication-plans/{plan_id}/schedule"),
              ("GET", "/v1/jobs/{job_id}"),
              ("POST", "/v1/jobs/{job_id}/metrics-collections"),
              ("POST", "/v1/performance-reviews"),
          }
          assert len(expected_v1_routes) == 10
          shipped_v1_routes = {
              (method.upper(), path)
              for path, operations in app.openapi()["paths"].items()
              if path.startswith("/v1/")
              for method in operations
              if method.upper() in {"GET", "POST", "PUT", "PATCH", "DELETE"}
          }
          assert shipped_v1_routes == expected_v1_routes
          download_contract = app.openapi()["paths"][
              "/v1/approval-requests/{approval_id}/assets/{asset_id}"
          ]["get"]
          assert set(download_contract["responses"]["200"]["content"]) == {
              "application/octet-stream"
          }
          assert download_contract["security"] == [{"HTTPBearer": []}]
          templates = Path(ai_ops.__file__).resolve().parent / "api" / "templates"
          required_templates = {
              "base.html",
              "dashboard.html",
              "login.html",
              "list.html",
              "article_detail.html",
              "account_detail.html",
          }
          assert all((templates / name).is_file() for name in required_templates)

          with open("doctor.json", encoding="utf-8") as stream:
              doctor = json.load(stream)
          assert doctor["schema_version"] == 1
          assert doctor["ok"] is True

          with open("demo.json", encoding="utf-8") as stream:
              demo = json.load(stream)
          assert demo["ok"] is True
          assert demo["exit_code"] == 0
          assert demo["synthetic"] is True
          assert demo["offline"] is True
          assert demo["credentials_used"] is False
          assert demo["external_calls"] == 0
          assert demo["review"]["passed"] is True

          with open("principal.json", encoding="utf-8") as stream:
              principal = json.load(stream)
          assert principal["schema_version"] == 1
          assert principal["token"].startswith("aop_")
          assert len(principal["token_sha256"]) == 64
          assert hashlib.sha256(principal["token"].encode()).hexdigest() == principal["token_sha256"]

          expected_agent_commands = {
              "stage-content",
              "plan-publication",
              "request-approval",
              "get-approval",
              "download-approval-asset",
              "decide-approval",
              "schedule",
              "get-job-status",
              "collect-metrics",
              "review-performance",
          }
          assert len(expected_agent_commands) == 10
          shipped_agent_commands = {
              command.name for command in agent_app.registered_commands
          }
          assert shipped_agent_commands == expected_agent_commands
          help_text = Path("agent-help.txt").read_text(encoding="utf-8")
          for command in expected_agent_commands:
              assert command in help_text
          assert Path("download-help.txt").stat().st_size > 0
          download_command = get_command(agent_app).commands[
              "download-approval-asset"
          ]
          download_params = {
              parameter.name: parameter for parameter in download_command.params
          }
          assert {"approval_id", "asset_id", "output"} <= set(download_params)
          assert download_params["approval_id"].required is True
          assert download_params["asset_id"].required is True
          assert download_params["output"].required is True
          assert "--output" in download_params["output"].opts
          PY

  postgres:
    name: PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_ops_ci
          POSTGRES_USER: ai_ops_ci
          POSTGRES_PASSWORD: ai_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_ops_ci -d ai_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ai_ops_ci:ai_ops_ci@127.0.0.1:5432/ai_ops_ci
      DATA_DIR: /tmp/ai-ops-ci-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PostgreSQL runtime
        run: python -m pip install -e ".[postgres]"
      - name: Migrate an empty PostgreSQL database to head
        run: |
          ai-ops init-db
          ai-ops doctor --json > postgres-doctor.json
          python - <<'PY'
          import json

          from ai_ops.core.db import get_code_alembic_head, get_db_alembic_head

          code_head = get_code_alembic_head()
          assert code_head
          assert get_db_alembic_head() == code_head

          with open("postgres-doctor.json", encoding="utf-8") as stream:
              doctor = json.load(stream)
          checks = {item["id"]: item for item in doctor["checks"]}
          assert doctor["ok"] is True
          assert checks["database.connectivity"]["outcome"] == "pass"
          assert checks["database.schema"]["outcome"] == "pass"
          PY

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-ops-auto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run image and migrate an empty SQLite database
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/docker-smoke.db \
            -e DATA_DIR=/tmp/ai-ops-data \
            ai-ops-auto:ci ai-ops --help
